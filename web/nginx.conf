# Configuration nginx du web c3-digital — application React monopage
# (React Router en mode "history") : toute route inconnue de nginx doit
# retomber sur index.html pour laisser React Router décider, sinon un
# rafraîchissement de page sur /inspections (par ex.) renvoie un 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers "hashés" par Vite (immutables) — cache long côté navigateur.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
