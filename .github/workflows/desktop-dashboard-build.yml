name: Desktop (tableau de bord IGE) — build Windows / macOS / Linux

# Construit l'application desktop du tableau de bord IGE (desktop/,
# Tauri — enveloppe native du web React existant, voir
# desktop/README.md) pour les 3 plateformes, chacune sur le runner
# GitHub qui lui correspond.
#
# Déclenchement manuel : onglet "Actions" du dépôt -> "Desktop (tableau
# de bord IGE) — build Windows / macOS / Linux" -> "Run workflow". Les 3
# installateurs sont ensuite disponibles en pièces jointes ("Artifacts")
# du run, pendant 90 jours.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL publique de l'API backend (intégrée au bundle web au moment du build — voir web/README.md)"
        required: false
        default: "http://localhost:3000"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # Depuis la racine : @c3-digital/shared doit être compilé avant le
      # web (voir web/README.md, "Note Vite + monorepo").
      - run: npm install
      - run: npm run build:shared
      - name: Build web (dist consommé par Tauri)
        run: npm run build --workspace=web
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url }}

      - name: cargo tauri build
        working-directory: desktop/src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: c3-digital-dashboard-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.app
          retention-days: 90
